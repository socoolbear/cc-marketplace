name: verify

# AGENTS.md 「검증 명령」 네 가지 (매니페스트 JSON · 버전 일치 · 스킬 내부 링크 · 플러그인 시험).
# 배포는 하지 않는다. 훅 플러그인이 macOS 전용이고 시험이 /bin/bash 3.2 호환을 함께 보므로 macOS 러너에서 돈다.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # workstyle 의 질문 분류 판정이 timeout 을 쓴다. 최신 macOS 는 기본으로 있고 러너 이미지에는 없을 수 있다
      - name: timeout 명령 확보
        run: command -v timeout || brew install coreutils
      - name: 검증 명령
        env:
          SPEED_BUDGET_MS: "4000"   # 러너가 이 장비보다 느리다 (2.4초 실측). 훅 제한 5초 안
        run: bash scripts/verify.sh
