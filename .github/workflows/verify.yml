name: verify

# AGENTS.md 「검증 명령」 다섯 가지 (매니페스트 JSON · 버전 일치 · 스킬 내부 링크 · 임시 폴더 지우기 보호 · 플러그인 시험).
# 배포는 하지 않는다. 훅 플러그인이 macOS 전용이고 시험이 /bin/bash 3.2 호환을 함께 보므로 macOS 러너에서 돈다.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # 매주 월요일 01:00 UTC (한국 10:00) — 러너 이미지 · Claude Code 같은 저장소 밖 변화로 깨진 것을 push 없이도 잡는다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # timeout 을 설치하지 않는다 — 훅은 없는 장비에서도 돌아야 하고 (질문 분류 판정의 대체 처리),
      # 러너에 없으면 시험이 그 경로를 실제로 돈다. 있는지는 로그로 남긴다 (있으면 그 경로는 CI 에서 시험되지 않는다).
      # 2026-11-21 macos-latest 러너에는 없었고 통과했다 — 대체 처리 경로가 시험된다
      - name: timeout 명령 유무 기록
        run: command -v timeout || echo "timeout 없음 — 대체 처리 경로로 시험"
      - name: 검증 명령
        env:
          SPEED_BUDGET_MS: "4000"   # 러너가 이 장비보다 느리다 (2.4초 실측). 훅 제한 5초 안
        run: bash scripts/verify.sh
